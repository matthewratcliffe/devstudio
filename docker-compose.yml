services:
  orchestrator:
    # Swap these two lines for the published image to skip building:
    #   image: ghcr.io/matthewratcliffe/devstudio:latest
    build: .
    image: devstudio
    container_name: devstudio
    restart: unless-stopped
    ports:
      - "7080:7080"
      # Only needed for the Codex "Browser sign-in" method, which redirects to a local callback.
      # Device code and token sign-in do not use it.
      - "1455:1455"
    volumes:
      # State, cloned repos, worktrees and project files.
      - devstudio-data:/data
      # CLI credentials: log in once through the web UI and they persist here.
      - devstudio-home:/home/orchestrator
      # Uncomment to let agents work on a checkout your IDE has open. Bind mount the folder, list
      # the mount point in Orchestrator__LocalRepositoryRoots below, then attach the repo from
      # Repositories → Attach local folder. Forward slashes on Windows.
      # - D:/repos:/host/repos
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Orchestrator__MaxConcurrentSessions: "6"
      Orchestrator__TurnTimeoutMinutes: "60"
      Orchestrator__SchedulerTickSeconds: "20"
      # Host directories that may be browsed and attached as repositories. This is an allow-list:
      # nothing outside it is reachable from the UI's folder picker. Only useful with the matching
      # bind mount above.
      # Orchestrator__LocalRepositoryRoots__0: "/host/repos"
      # Agents run their own commands. The container is the boundary, so the CLIs are told not to
      # build a second sandbox inside it: both use bubblewrap, which needs unprivileged user
      # namespaces, and Docker's default seccomp profile blocks them — bwrap then fails and every
      # command dies before it starts.
      #
      # To keep the CLIs' own sandboxes instead, set this false and give the container the right to
      # create namespaces by uncommenting security_opt below.
      Orchestrator__ContainerIsTheSandbox: "true"
      # Uncomment to delete each session's worktree when it finishes.
      # Orchestrator__PruneEphemeralWorktrees: "true"
    # Lets bubblewrap create the namespaces the CLI sandboxes need. Only useful with
    # Orchestrator__ContainerIsTheSandbox set to false; it loosens the container's own seccomp
    # filter, which is the trade being made either way.
    # security_opt:
    #   - seccomp:unconfined

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  devstudio-data:
  devstudio-home:
