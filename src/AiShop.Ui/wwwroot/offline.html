<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Shop — offline</title>
    <link rel="stylesheet" href="/app.css" />
</head>
<body>
    <div style="min-height:100vh;display:grid;place-items:center;text-align:center;padding:2rem">
        <div>
            <div class="brand-mark" style="width:56px;height:56px;font-size:1.2rem;margin:0 auto 1.2rem">&gt;_</div>

    </div>
